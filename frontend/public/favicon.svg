<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="mArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Matte Black Base -->
  <rect width="100" height="100" rx="22" fill="#09090b" />
  <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="#27272a" stroke-width="1.5" />

  <!-- Letter S -->
  <path
    d="M 37 31 C 34 26 23 26 20 31 C 17 36 19 43 25 46 L 31 49 C 38 52 40 60 37 66 C 34 71 23 72 18 67"
    fill="none"
    stroke="#ffffff"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Letter M with the end dipping down and surging UP as an arrow -->
  <!-- Left leg: (46, 68) to (46, 30) -->
  <!-- Center drop: (46, 30) to (57, 52) -->
  <!-- Center rise: (57, 52) to (68, 30) -->
  <!-- Down dip (market pullback): (68, 30) to (78, 62) -->
  <!-- Surging up (breakout arrow): (78, 62) to (88, 32) -->
  <path
    d="M 46 68 L 46 30 L 57 50 L 68 30 L 78 62 L 88 32"
    fill="none"
    stroke="url(#mArrowGrad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Arrowhead pointing UP-RIGHT on the end of the M -->
  <path
    d="M 77 30 L 89 31 L 88 43"
    fill="none"
    stroke="#34d399"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
</svg>